<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tilawat</title>
<meta name="theme-color" content="#08171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tilawat">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#08171a; --card:#0f2624; --card2:#143230; --line:rgba(255,255,255,.08);
  --ink:#f1ebdd; --muted:rgba(241,235,221,.58); --gold:#e3c27a; --teal:#4fb3a5;
  --ok:#5cd98c; --bad:#f26b61;
  --ar:"Amiri Quran","Amiri","Geeza Pro",serif; --ur:"Noto Nastaliq Urdu","Geeza Pro",serif;
  --size:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:10px}
.view{min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px)}
[hidden]{display:none!important}

/* Home */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px}
.brand{font:700 30px/1 Outfit,system-ui,sans-serif;letter-spacing:-.02em}
.brand span{color:var(--gold)}
.brand-ar{font:28px/1 var(--ar);color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.stat svg{width:24px;height:24px;color:var(--gold);flex:none}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat small{color:var(--muted);font-size:12.5px}
.cont{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:linear-gradient(120deg,var(--card2),var(--card));border:1px solid rgba(227,194,122,.25);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.cont small{color:var(--muted);font-size:12.5px;display:block}
.cont b{font-size:17px}
.cont .ar{font:24px/1.4 var(--ar);color:var(--gold)}
.search{width:100%;font:16px Outfit,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.search::placeholder{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);min-height:64px}
.num{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600}
.num::before,.num::after{content:"";position:absolute;inset:6px;border:1.3px solid var(--gold);border-radius:4px;opacity:.75}
.num::after{transform:rotate(45deg)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t small{color:var(--muted);font-size:13px}
.row .ar{font:22px/1.3 var(--ar);color:var(--gold);white-space:nowrap}
.msg{color:var(--muted);text-align:center;padding:40px 10px}
.msg button{margin-top:12px;color:var(--gold);font-weight:600}

/* Reader */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 8px 8px;background:rgba(8,23,26,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar h2{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--gold)}
.ib svg{width:24px;height:24px}
.ib.on{background:rgba(227,194,122,.15)}
#reader.view{padding-top:0}
.shead{text-align:center;padding:26px 0 18px}
.shead .ar{font:38px/1.5 var(--ar);color:var(--gold)}
.shead p{margin:2px 0;color:var(--muted);font-size:14px}
.bism{font:28px/2 var(--ar);margin-top:10px}
.acts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;border:1px solid rgba(227,194,122,.45);color:var(--gold)}
.btn.pri{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn svg{width:18px;height:18px}
.settings{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;margin:0 0 6px;background:var(--card);border-radius:14px}
.settings button{min-height:40px;padding:0 14px;border-radius:10px;background:var(--card2);font-weight:600}
.settings button.on{background:var(--gold);color:var(--bg)}
.ayah{padding:14px 4px 18px;border-bottom:1px solid var(--line)}
.ayah.playing{background:rgba(79,179,165,.1);border-radius:14px}
.ahead{display:flex;align-items:center;gap:4px}
.anum{width:32px;height:32px;border-radius:50%;border:1.2px solid rgba(227,194,122,.6);display:grid;place-items:center;font-size:12.5px;font-weight:600;margin-right:auto}
.atext{direction:rtl;text-align:right;font:var(--size)/2.05 var(--ar);margin:8px 2px 0;word-spacing:.08em}
.aur{direction:rtl;text-align:right;font:15px/2.1 var(--ur);color:var(--muted);margin:6px 2px 0}

/* Practice */
#practice{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#practice .bar{margin:0;position:static}
.pbody{flex:1;overflow:auto;padding:18px 16px}
.pcount{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:12px}
.pcard{direction:rtl;text-align:center;background:var(--card);border-radius:20px;padding:22px 16px;font:calc(var(--size) + 4px)/2.2 var(--ar)}
.w{transition:color .2s}
.w.ok{color:var(--ok)} .w.bad{color:var(--bad)}
.w.hid{color:rgba(241,235,221,.25)}
.score{display:flex;justify-content:center;gap:22px;margin:18px 0 6px}
.score div{text-align:center;min-width:64px}
.score b{display:block;font-size:24px}
.score small{color:var(--muted);font-size:12.5px}
.verdict{text-align:center;font-weight:600;margin:6px 0}
.heard{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
.heard div{font:17px/1.8 var(--ar);direction:rtl}
.err{color:var(--bad);text-align:center;font-size:14px;margin-top:12px}
.pfoot{background:var(--card);padding:16px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line)}
.mic{display:grid;place-items:center;width:80px;height:80px;margin:0 auto;border-radius:50%;background:var(--gold);color:var(--bg);box-shadow:0 0 0 0 rgba(227,194,122,.5)}
.mic svg{width:32px;height:32px}
.mic.live{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,107,97,.55)}100%{box-shadow:0 0 0 22px rgba(242,107,97,0)}}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 12px}
.nav3{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nav3 button{min-height:44px;padding:0 10px;font-weight:600;color:var(--gold);font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.nav3 button:disabled{opacity:.3}
.nav3 svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}.w{transition:none}}
</style>
</head>

<!-- HOME -->
<main id="home" class="view">
  <div class="top">
    <div class="brand">Tilawat<span>.</span></div>
    <div class="brand-ar" lang="ar">تلاوة</div>
  </div>
  <div class="stats">
    <div class="stat"><svg><use href="#i-fire"/></svg><div><b id="streak">0</b><small>din ki streak</small></div></div>

  </div>
  <button class="cont" id="cont" hidden></button>
  <input class="search" id="q" type="search" placeholder="Surah ka naam ya number" autocomplete="off" aria-label="Surah dhoondhein">

<!-- READER -->

  <div class="bar">
    <button class="ib" id="back" aria-label="Wapas"><svg><use href="#i-back"/></svg></button>
    <h2 id="rtitle"></h2>

  </div>

</main>

<!-- PRACTICE -->
<section id="practice" hidden aria-label="Tilawat check">
  <div class="bar">
    <button class="ib" id="pclose" aria-label="Band karein"><svg><use href="#i-x"/></svg></button>
    <h2 id="ptitle"></h2>
    <button class="ib" id="hifzBtn" aria-label="Hifz mode: lafz chhupao"><svg><use href="#i-eye"/></svg></button>
  </div>

    <div class="pcount" id="pcount"></div>
    <div class="pcard" id="pcard" lang="ar"></div>

  </div>

      <button id="prev"><svg><use href="#i-back"/></svg>Pichli</button>

  </div>

<script>
{
const API = 'https://api.alquran.cloud/v1';
const EDITIONS = 'quran-simple,ur.jalandhry,ar.alafasy';
const BISM = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
const $ = id => document.getElementById(id);
const arName = s => s.replace('سُورَةُ ', '').replace(/\u06E1/g, '\u0652');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let size = store.get('size', 28), showUrdu = store.get('urdu', true), hifz = store.get('hifz', false);
document.documentElement.style.setProperty('--size', size + 'px');

// ---------- Arabic matching (Swift app wali logic) ----------
function norm(s) {
  let o = '';
  for (const ch of s) {
    const v = ch.codePointAt(0);
    if ((v >= 0x064B && v <= 0x065F) || v === 0x0670 || (v >= 0x06D6 && v <= 0x06ED) || v === 0x0640) continue;
    if (v === 0x0622 || v === 0x0623 || v === 0x0625 || v === 0x0671) { o += 'ا'; continue; }
    if (v === 0x0649 || v === 0x0626) { o += 'ي'; continue; }
    if (v === 0x0629) { o += 'ه'; continue; }
    if (v === 0x0624) { o += 'و'; continue; }
    if (v >= 0x0621 && v <= 0x064A) o += ch;
  }
  return o;
}
const words = s => s.split(/\s+/).map(norm).filter(Boolean);
const targetWords = s => s.split(/\s+/).map(d => ({ d, n: norm(d) })).filter(w => w.n);
function sim(a, b) {
  a = [...a]; b = [...b];
  if (!a.length || !b.length) return 0;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return 1 - prev[b.length] / Math.max(a.length, b.length);
}
const match = (t, s) => t === s || (Math.min(t.length, s.length) > 2 && sim(t, s) >= 0.6);
function align(T, S) {
  const st = T.map(() => 0); let p = 0;            // 0 baaki, 1 sahi, 2 chhoota
  for (const w of S) {
    if (p >= T.length) break;
    for (let j = p; j < Math.min(p + 4, T.length); j++) {
      if (match(T[j], w)) { for (let k = p; k < j; k++) st[k] = 2; st[j] = 1; p = j + 1; break; }
    }
  }
  return st;
}

// ---------- data ----------
let surahs = [], cur = null, ayahs = [];
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadSurahs() {
  surahs = store.get('surahs', []);
  if (surahs.length) return renderList();
  try {
    surahs = (await getJSON(API + '/surah')).data;
    store.set('surahs', surahs);
    renderList();
  } catch {
    $('list').innerHTML = '<div class="msg">Surahs load nahi ho sakin. Internet check karein.<br><button id="retry">Dobara koshish</button></div>';
    $('retry').onclick = loadSurahs;
  }
}
async function loadAyahs(n) {
  const c = store.get('surah_' + n, null);
  if (c) return c;
  const parts = (await getJSON(`${API}/surah/${n}/editions/${EDITIONS}`)).data;
  const ed = id => (parts.find(p => p.edition.identifier === id) || { ayahs: [] }).ayahs;
  const ar = ed('quran-simple'), ur = ed('ur.jalandhry'), au = ed('ar.alafasy');
  const out = ar.map((a, i) => {
    let t = a.text;
    if (a.numberInSurah === 1 && n !== 1 && n !== 9) {
      const w = t.split(' ');
      if (w.length > 4 && norm(w[0]) === 'بسم') t = w.slice(4).join(' ');
    }
    return { id: a.number, k: a.numberInSurah, ar: t, ur: ur[i] ? ur[i].text : '', au: au[i] ? au[i].audio : '' };
  });
  store.set('surah_' + n, out);
  return out;
}

// ---------- progress ----------
function dayKey(d = new Date()) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function renderStats() {
  const last = store.get('lastDay', ''), y = new Date(); y.setDate(y.getDate() - 1);
  let streak = store.get('streak', 0);
  if (last !== dayKey() && last !== dayKey(y)) streak = 0;     // streak toot gayi
  $('streak').textContent = streak;
  $('perfect').textContent = store.get('perfect', 0);
}
function recordPerfect() {
  store.set('perfect', store.get('perfect', 0) + 1);
  const today = dayKey(), last = store.get('lastDay', ''), y = new Date(); y.setDate(y.getDate() - 1);
  if (last !== today) {
    store.set('streak', last === dayKey(y) ? store.get('streak', 0) + 1 : 1);
    store.set('lastDay', today);
  }
}

// ---------- audio ----------
const player = new Audio();
let queue = [], playingId = null;
function play(a, rest = []) {
  queue = rest; playingId = a.id;
  player.src = a.au; player.play().catch(() => {});
  markPlaying();
}
function stopAudio() { player.pause(); queue = []; playingId = null; markPlaying(); }
player.onended = () => { if (queue.length) play(queue.shift(), queue); else { playingId = null; markPlaying(); } };
function markPlaying() {
  document.querySelectorAll('.ayah').forEach(el => {
    const on = +el.dataset.id === playingId;
    el.classList.toggle('playing', on);
    el.querySelector('.pl use').setAttribute('href', on ? '#i-stop' : '#i-play');
  });
  const all = $('playAll');
  if (all) all.innerHTML = playingId ? '<svg><use href="#i-stop"/></svg>Rokein' : '<svg><use href="#i-play"/></svg>Poori suniye';
  if (!$('practice').hidden && ayahs[pIndex]) $('listen').querySelector('span').textContent = playingId === ayahs[pIndex].id ? 'Rokein' : 'Sahi tilawat suniye';
}

// ---------- home ----------
function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const f = q ? surahs.filter(s => s.englishName.toLowerCase().includes(q) || s.englishNameTranslation.toLowerCase().includes(q) || s.name.includes(q) || String(s.number) === q) : surahs;
  $('list').innerHTML = f.map(s => `<button class="row" data-n="${s.number}">
    <span class="num">${s.number}</span>
    <span class="t"><b>${esc(s.englishName)}</b><small>${esc(s.englishNameTranslation)} · ${s.numberOfAyahs} ayaat</small></span>
    <span class="ar" lang="ar">${esc(arName(s.name))}</span></button>`).join('') || '<p class="msg">Koi surah nahi mili</p>';
  const last = store.get('lastSurah', 0), ls = surahs.find(s => s.number === last);
  $('cont').hidden = !ls;
  if (ls) $('cont').innerHTML = `<span><small>Wahin se shuru karein</small><b>${ls.number}. ${esc(ls.englishName)}</b></span><span class="ar" lang="ar">${esc(arName(ls.name))}</span>`;
}
$('q').oninput = renderList;
$('list').onclick = e => { const r = e.target.closest('.row'); if (r) location.hash = 's' + r.dataset.n; };
$('cont').onclick = () => { location.hash = 's' + store.get('lastSurah', 1); };

// ---------- reader ----------
async function openSurah(n) {
  cur = surahs.find(s => s.number === n);
  if (!cur) return;
  store.set('lastSurah', n);
  $('home').hidden = true; $('reader').hidden = false; window.scrollTo(0, 0);
  $('rtitle').textContent = cur.englishName;
  $('shead').innerHTML = `<div class="ar" lang="ar">${esc(arName(cur.name))}</div>
    <p>${esc(cur.englishName)} · ${esc(cur.englishNameTranslation)}</p>
    <p>${cur.revelationType === 'Meccan' ? 'Makki' : 'Madani'} · ${cur.numberOfAyahs} ayaat</p>
    ${n !== 1 && n !== 9 ? `<div class="bism" lang="ar">${BISM}</div>` : ''}
    <div class="acts"><button class="btn" id="playAll"><svg><use href="#i-play"/></svg>Poori suniye</button>
    <button class="btn pri" id="checkAll"><svg><use href="#i-mic"/></svg>Tilawat check</button></div>`;
  $('ayahs').innerHTML = '<p class="msg">Ayaat load ho rahi hain…</p>';
  try { ayahs = await loadAyahs(n); }
  catch { $('ayahs').innerHTML = '<p class="msg">Ayaat load nahi ho sakin. Internet check karein.</p>'; return; }
  if (cur.number !== n) return;
  $('ayahs').innerHTML = ayahs.map((a, i) => `<div class="ayah" data-id="${a.id}" data-i="${i}">
    <div class="ahead"><span class="anum">${a.k}</span>
      <button class="ib pl" aria-label="Ayah ${a.k} suniye"><svg><use href="#i-play"/></svg></button>
      <button class="ib pr" aria-label="Ayah ${a.k} ki tilawat check"><svg><use href="#i-mic"/></svg></button></div>
    <p class="atext" lang="ar">${esc(a.ar)}</p>
    <p class="aur" lang="ur" ${showUrdu ? '' : 'hidden'}>${esc(a.ur)}</p></div>`).join('');
  $('playAll').onclick = () => playingId ? stopAudio() : play(ayahs[0], ayahs.slice(1));
  $('checkAll').onclick = () => openPractice(0);
  markPlaying();
}
$('ayahs').onclick = e => {
  const row = e.target.closest('.ayah'); if (!row) return;
  const a = ayahs[+row.dataset.i];
  if (e.target.closest('.pl')) playingId === a.id ? stopAudio() : play(a);
  if (e.target.closest('.pr')) openPractice(+row.dataset.i);
};
$('back').onclick = () => { location.hash = ''; };
$('setBtn').onclick = () => { $('settings').hidden = !$('settings').hidden; $('setBtn').classList.toggle('on', !$('settings').hidden); };
function setSize(d) { size = Math.min(44, Math.max(20, size + d)); store.set('size', size); document.documentElement.style.setProperty('--size', size + 'px'); }
$('smaller').onclick = () => setSize(-3);
$('bigger').onclick = () => setSize(3);
function paintUrdu() { $('urduBtn').classList.toggle('on', showUrdu); document.querySelectorAll('.aur').forEach(p => p.hidden = !showUrdu); }
$('urduBtn').onclick = () => { showUrdu = !showUrdu; store.set('urdu', showUrdu); paintUrdu(); };

// ---------- practice (tilawat check) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let pIndex = 0, rec = null, listening = false, transcript = '', T = [], celebrated = false;
function openPractice(i) {
  stopAudio();
  pIndex = i; $('practice').hidden = false; document.body.style.overflow = 'hidden';
  $('ptitle').textContent = cur.englishName;
  $('hifzBtn').classList.toggle('on', hifz);
  loadPracticeAyah();
}
function loadPracticeAyah() {
  stopListening(); transcript = ''; celebrated = false;
  T = targetWords(ayahs[pIndex].ar);
  $('pcount').textContent = `Ayah ${ayahs[pIndex].k} / ${ayahs.length}`;
  $('prev').disabled = pIndex === 0;
  $('next').disabled = pIndex >= ayahs.length - 1;
  $('perr').hidden = true;
  paintPractice();
  markPlaying();
}
function paintPractice() {
  const st = align(T.map(w => w.n), words(transcript));
  $('pcard').innerHTML = T.map((w, i) => {
    if (st[i] === 1) return `<span class="w ok">${esc(w.d)}</span>`;
    if (st[i] === 2) return `<span class="w bad">${esc(w.d)}</span>`;
    return hifz ? `<span class="w hid">${'ـ'.repeat(Math.max(3, w.n.length + 1))}</span>` : `<span class="w">${esc(w.d)}</span>`;
  }).join(' ');
  const ok = st.filter(x => x === 1).length, bad = st.filter(x => x === 2).length;
  const done = !listening && transcript;
  $('presult').innerHTML = (listening || done) ? `<div class="score">
      <div><b style="color:var(--ok)">${ok}</b><small>sahi</small></div>
      <div><b style="color:var(--bad)">${bad}</b><small>chhoote</small></div>
      <div><b>${T.length - ok - bad}</b><small>baaki</small></div></div>
      ${done ? (ok === T.length ? '<div class="verdict" style="color:var(--ok)">MashaAllah! Poori ayah bilkul sahi 🤍</div>' : '<div class="verdict" style="color:var(--muted)">Laal lafz dobara dekh lein, phir koshish karein.</div>') : ''}` : '';
  $('heard').hidden = !transcript; $('heardText').textContent = transcript;
  if (ok === T.length && T.length) {
    if (listening) stopListening();
    if (!celebrated) { celebrated = true; recordPerfect(); if (navigator.vibrate) navigator.vibrate(60); }
  }
}
function showErr(m) { $('perr').textContent = m; $('perr').hidden = false; }
function startListening() {
  if (!SR) return showErr('Is browser mein tilawat check nahi chalta. iPhone par Safari, ya Chrome mein kholein.');
  stopAudio(); transcript = ''; celebrated = false; $('perr').hidden = true;
  rec = new SR();
  rec.lang = 'ar-SA'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript + ' '; transcript = t.trim(); paintPractice(); };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showErr('Mic ki ijazat nahi mili. Settings > Safari > Microphone mein Allow karein.');
    else if (e.error === 'network') showErr('Tilawat check ke liye internet chahiye.');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') showErr('Mic mein masla aaya (' + e.error + '). Dobara koshish karein.');
  };
  rec.onend = () => { listening = false; paintMic(); paintPractice(); };
  try { rec.start(); listening = true; } catch { showErr('Mic shuru nahi ho saka. Dobara dabayein.'); }
  paintMic(); paintPractice();
}
function stopListening() { if (rec) { try { rec.stop(); } catch {} } listening = false; paintMic(); }
function paintMic() {
  $('mic').classList.toggle('live', listening);
  $('mic').querySelector('use').setAttribute('href', listening ? '#i-stop' : '#i-mic');
  $('mic').setAttribute('aria-label', listening ? 'Sunna band karein' : 'Tilawat shuru karein');
  $('hint').textContent = listening ? 'Sun raha hoon… tilawat karein' : 'Mic dabayein aur ayah padhein';
}
$('mic').onclick = () => listening ? stopListening() : startListening();
$('prev').onclick = () => { if (pIndex > 0) { pIndex--; stopAudio(); loadPracticeAyah(); } };
$('next').onclick = () => { if (pIndex < ayahs.length - 1) { pIndex++; stopAudio(); loadPracticeAyah(); } };
$('listen').onclick = () => { stopListening(); const a = ayahs[pIndex]; playingId === a.id ? stopAudio() : play(a); };
$('hifzBtn').onclick = () => { hifz = !hifz; store.set('hifz', hifz); $('hifzBtn').classList.toggle('on', hifz); paintPractice(); };
$('pclose').onclick = () => { stopListening(); stopAudio(); $('practice').hidden = true; document.body.style.overflow = ''; };

// ---------- routing ----------
function route() {
  const m = location.hash.match(/^#s(\d+)$/);
  if (m && surahs.length) openSurah(+m[1]);
  else { stopAudio(); $('reader').hidden = true; $('home').hidden = false; $('settings').hidden = true; renderStats(); renderList(); }
}
window.addEventListener('hashchange', route);

paintUrdu();
renderStats();
loadSurahs().then(route);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
